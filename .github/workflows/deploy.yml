# ------------------------------------------------------------------
# Publishes the site to GitHub Pages automatically.
#
# Two ways to use this workflow — pick ONE and delete the other job:
#
#   JOB 1 (default) "build-from-source"
#     Installs dependencies and runs `npm run build` on every push,
#     then publishes the `site/` output. Needs nothing but a push.
#
#   JOB 2 (commented out) "publish-committed-build"
#     Publishes the already-committed `site/` folder with no install
#     step at all. Use this if you never want to run npm yourself.
#
# One-time setup in the repo:
#   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
# ------------------------------------------------------------------

name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-from-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build-from-source
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ------------------------------------------------------------------
  # JOB 2 — publish the pre-built `site/` folder with no npm install.
  # To use it: comment out (or delete) the two jobs above, then
  # uncomment the job below.
